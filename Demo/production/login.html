<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Sabtech Group</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2A3F54 0%, #34495E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2A3F54, #1ABB9C);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-section h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .logo-section .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2A3F54, #1ABB9C);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .login-title {
            color: #555;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-label {
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        .form-control:focus {
            border-color: #1ABB9C;
            box-shadow: 0 0 0 4px rgba(26, 187, 156, 0.1);
            outline: none;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.1);
        }
        
        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            pointer-events: none;
        }
        
        .form-group .form-control {
            padding-right: 50px;
        }
        
        .remember-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remember-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1ABB9C;
        }
        
        .remember-checkbox label {
            color: #666;
            font-size: 14px;
            cursor: pointer;
            margin: 0;
        }
        
        .forgot-password {
            color: #1ABB9C;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .forgot-password:hover {
            color: #2A3F54;
            text-decoration: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2A3F54 0%, #1ABB9C 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(26, 187, 156, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 20px;
            padding: 15px 20px;
        }
        
        .footer-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e1e5e9;
            text-align: center;
        }
        
        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .footer-logo h2 {
            color: #1ABB9C;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
        }
        
        .footer-logo .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #2A3F54, #1ABB9C);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
        
        .footer-text {
            color: #888;
            font-size: 12px;
            margin: 0;
        }
        
        .version-text {
            color: #aaa;
            font-size: 11px;
            margin-top: 5px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
                margin: 10px;
            }
            
            .logo-section h1 {
                font-size: 28px;
            }
            
            .form-control {
                padding: 12px 15px;
            }
        }
    </style>
  </head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>
                <div class="logo-icon">
                    <i class="fas fa-user-shield"></i>
              </div>
                Inicio de Sesión
            </h1>
            <p class="login-title">Accede a tu cuenta de Sabtech Group</p>
              </div>
        
        <!-- Alert Container -->
        <div id="alertContainer"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
                <i class="fas fa-user input-icon"></i>
              </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
              </div>
            
            <div class="remember-section">
                <div class="remember-checkbox">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Recordar usuario</label>
                </div>
                <a href="#" class="forgot-password" id="forgotPassword">¿Olvidaste tu contraseña?</a>
              </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Iniciar Sesión</span>
            </button>
            </form>
        
        <div class="footer-section">
            <div class="footer-logo">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
        </div>
                <h2>Sabtech Group</h2>
              </div>
            <p class="footer-text">©2025 Sistema Hotelero [Empresa Mandante]</p>
            <p class="version-text">Versión 1.0.0</p>
              </div>
              </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SISTEMA DE AUTENTICACIÓN SIMPLE -->
    <script src="auth-simple.js"></script>
    
    <script>
        $(document).ready(function() {
            // Load saved username if remember me was checked
            if (localStorage.getItem('rememberMe') === 'true') {
                $('#username').val(localStorage.getItem('username'));
                $('#rememberMe').prop('checked', true);
            }

            // Handle form submission
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                const rememberMe = $('#rememberMe').is(':checked');
                
                // Clear previous alerts
                clearAlerts();
                
                // Validate form
                if (!validateForm(username, password)) {
                    return false;
                }
                
                // Show loading state
                showLoading(true);
                
                // Simulate login process
                setTimeout(function() {
                    if (authenticateUser(username, password)) {
                        // Save username if remember me is checked
                        if (rememberMe) {
                            localStorage.setItem('username', username);
                            localStorage.setItem('rememberMe', 'true');
                        } else {
                            localStorage.removeItem('username');
                            localStorage.removeItem('rememberMe');
                        }
                        
                        showAlert('success', '¡Bienvenido! Redirigiendo...');
                        
                        // Redirect based on user role
        setTimeout(function() {
            // Generar token de sesión único
            var sessionToken = 'token_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            if (username.toLowerCase() === 'plataforma') {
                setUserSession('plataforma', sessionToken);
                window.location.href = 'index.html'; // Página principal del administrador
            } else if (username.toLowerCase() === 'admin') {
                setUserSession('admin', sessionToken);
                window.location.href = 'index3.html'; // Página de servicios para admin
            } else if (username.toLowerCase() === 'huesped') {
                setUserSession('huesped', sessionToken);
                window.location.href = 'index2.html'; // Página de reservas para huesped
            } else if (username.toLowerCase() === 'personal') {
                setUserSession('personal', sessionToken);
                window.location.href = 'mantencion.html'; // Página específica para personal
            } else {
                setUserSession('guest', sessionToken);
                window.location.href = 'Home.html'; // Página de selección de perfiles
            }
        }, 1500);
                    } else {
                        showLoading(false);
                        showAlert('danger', 'Usuario o contraseña incorrectos. Inténtalo de nuevo.');
                    }
                }, 2000);
                
                return false;
            });

            // Handle forgot password
            $('#forgotPassword').on('click', function(e) {
                e.preventDefault();
                showAlert('info', 'Funcionalidad de recuperación de contraseña próximamente disponible.');
            });

            // Real-time validation and cleanup
            $('#username, #password').on('input', function() {
                clearAlerts();
                $(this).removeClass('is-invalid');
            });
        });

        function validateForm(username, password) {
            if (!username || username.length === 0) {
                showAlert('warning', 'Por favor ingresa tu usuario.');
                $('#username').focus().addClass('is-invalid');
                return false;
            }
            
            if (!password || password.length === 0) {
                showAlert('warning', 'Por favor ingresa tu contraseña.');
                $('#password').focus().addClass('is-invalid');
                return false;
            }
            
            if (username.length < 3) {
                showAlert('warning', 'El usuario debe tener al menos 3 caracteres.');
                $('#username').focus().addClass('is-invalid');
                return false;
            }
            
            if (password.length < 6) {
                showAlert('warning', 'La contraseña debe tener al menos 6 caracteres.');
                $('#password').focus().addClass('is-invalid');
                return false;
            }
            
            $('#username, #password').removeClass('is-invalid');
            return true;
        }

        function authenticateUser(username, password) {
            // Demo authentication
            const validUsers = {
                'plataforma': 'admin123',
                'admin': 'admin123',
                'huesped': 'admin123',
                'personal': 'admin123'
            };
            
            return validUsers[username.toLowerCase()] === password;
        }

        function showAlert(type, message) {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <strong>${getAlertTitle(type)}</strong> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            $('#alertContainer').html(alertHtml);
            
            // Auto-dismiss after 5 seconds
            setTimeout(function() {
                $('.alert').fadeOut();
            }, 5000);
        }

        function getAlertTitle(type) {
            const titles = {
                'success': '¡Éxito!',
                'danger': 'Error:',
                'warning': 'Advertencia:',
                'info': 'Información:'
            };
            return titles[type] || '';
        }

        function clearAlerts() {
            $('#alertContainer').empty();
        }

        function showLoading(show) {
            if (show) {
                $('.btn-text').hide();
                $('.loading-spinner').show();
                $('#loginBtn').prop('disabled', true);
            } else {
                $('.btn-text').show();
                $('.loading-spinner').hide();
                $('#loginBtn').prop('disabled', false);
            }
        }
    </script>
  </body>
</html>
